    function CodeMirrorEditor({ activeTab, handleTabContentChange, handleCodeKeyDown }) {
      const editorRef = React.useRef(null);
      const cmInstance = React.useRef(null);

      React.useEffect(() => {
            if (editorRef.current && !cmInstance.current) {
                cmInstance.current = window.CodeMirror.fromTextArea(editorRef.current, {
                    mode: "python",
                    theme: "dracula",
                    lineNumbers: true,
                    indentUnit: 4,
                    tabSize: 4,
                });

                // 同步變化
                cmInstance.current.on("change", (cm) => {
                    // 確保 activeTab 存在才呼叫
                    if(activeTab) {
                        handleTabContentChange(activeTab.id, cm.getValue());
                    }
                });
                 // 添加鍵盤事件監聽
                 cmInstance.current.on("keydown", (cm, event) => {
                     if (activeTab) {
                         handleCodeKeyDown(event, activeTab.id);
                     }
                 });
            }

            // 每次切換 tab 時更新內容
            if (cmInstance.current && activeTab && activeTab.content !== cmInstance.current.getValue()) {
                // 保存目前游標位置
                const cursor = cmInstance.current.getCursor();
                cmInstance.current.setValue(activeTab.content);
                // 嘗試恢復游標位置 (如果行數還存在)
                try {
                    cmInstance.current.setCursor(cursor);
                } catch (e) {
                    // 如果舊游標位置無效，移到文件末尾
                     cmInstance.current.setCursor(cmInstance.current.lineCount(), 0);
                }
                 // 確保編輯器獲得焦點
                 setTimeout(() => cmInstance.current.focus(), 0);
            } else if (cmInstance.current && !activeTab) {
                 // 如果沒有 activeTab，清空編輯器
                 cmInstance.current.setValue('');
            }

            // 組件卸載時清理 CodeMirror 實例
            return () => {
                if (cmInstance.current) {
                    cmInstance.current.toTextArea(); // 恢復成 textarea
                    cmInstance.current = null;
                }
            };
        }, [activeTab]); // 依賴 activeTab 來觸發更新

      return (
            // 我們仍然需要 textarea 作為 CodeMirror 的基礎
            <textarea ref={editorRef} style={{ display: 'none' }} />
        );
    }

          setCourses(mockCourses);

          if (savedProgressRaw) {
            try {
              const savedProgress = JSON.parse(savedProgressRaw);
              const lastCourse = mockCourses.find(c => c.id === savedProgress.lastCourseId) || mockCourses[0];
              if (!lastCourse) return;

              const courseModules = mockModules[lastCourse.id] || [];
              const lastModuleId = savedProgress.lastModuleId;
              let lastModule = null;
              let parentModule = null;

              for (const module of courseModules) {
                if (module.id === lastModuleId) {
                  lastModule = module;
                  break;
                }
                if (module.submodules) {
                  const foundSub = module.submodules.find(sm => sm.id === lastModuleId);
                  if (foundSub) {
                    lastModule = foundSub;
                    parentModule = module;
                    break;
                  }
                }
              }

              if (!lastModule && courseModules.length > 0) {
                const firstModule = courseModules[0];
                lastModule =
                  firstModule.submodules && firstModule.submodules.length > 0
                    ? firstModule.submodules[0]
                    : firstModule;
                if (firstModule.submodules) parentModule = firstModule;
              }

              setSelectedCourse(lastCourse);
              setCurrentModule(lastModule);
              if (parentModule) {
                setExpandedModules(prev => ({ ...prev, [parentModule.id]: true }));
              }

              if (savedProgress.tabs && Array.isArray(savedProgress.tabs) && savedProgress.tabs.length > 0) {
                setTabs(savedProgress.tabs);
                setActiveTabId(savedProgress.activeTabId || savedProgress.tabs[0].id);
              } else if (lastModule) {
                handleModuleSelect(lastModule, true);
              }

              });

              newSocket.on('disconnect', () => {
                  console.log('[Socket.IO] 連線中斷');
                  setSocket(null); // 清理 socket 狀態
                  // 如果有程式碼正在執行，可能需要更新 UI 狀態
                  setIsExecuting(false);

                  showMessageModal('與執行服務連線中斷。');
              });

              newSocket.on('connect_error', (err) => {
                    console.error('[Socket.IO] 連線錯誤:', err);
                    showMessageModal(`無法連接執行服務: ${err.message}`);
                });

              // 監聽來自後端的輸出
              newSocket.on('terminal_output', (data) => {
                  // --- 🔽 [修改] 偵測是否需要輸入 ---
                  let shouldWaitForInput = false;
                  // 簡單的偵測邏輯：如果輸出結尾是 ': ' 且沒有換行，可能是在等待輸入
                  if (data.trim().endsWith(':')) {
                        shouldWaitForInput = true;
                  }
                  setIsWaitingForInput(shouldWaitForInput); // 設定等待狀態
                  // --- 🔼 [修改] --------------------
                  setTabs(prevTabs => {
                      return prevTabs.map(t => {
                          if (t.id === activeTabId && t.type === 'code') {
                              // 將新收到的 data 附加到現有的 output 後面
                              // 如果之前是 '執行中...', 就替換掉
                              const currentOutput = t.output === '執行中...' ? '' : t.output;
                              return { ...t, output: currentOutput + data, error: '' }; // 清除之前的錯誤
                          }
                          return t;
                      });
                  });
              });

              // 監聽程式結束事件
              newSocket.on('terminal_exit', (message) => {
                  setTabs(prevTabs => prevTabs.map(t => {
                        if (t.id === activeTabId && t.type === 'code') {
                          const currentOutput = t.output === '執行中...' ? '' : t.output;
                            return { ...t, output: currentOutput + `\n--- ${message} ---`, error: '' };
                        }
                        return t;
                  }));
                  setIsExecuting(false); // 標記為執行結束
              });

              // 監聽後端產生的錯誤 (例如 Python 啟動失敗)
              newSocket.on('terminal_error', (errorMessage) => {
                    setTabs(prevTabs => prevTabs.map(t => {
                        if (t.id === activeTabId && t.type === 'code') {

                </div>
                {!isLoginView && (
                  <div className="flex items-center justify-between">
                    <label htmlFor="student-name-input" className="text-sm font-medium text-slate-300">姓名</label>
                    <input type="text" id="student-name-input" required value={studentName} onChange={(e) => setStudentName(e.target.value)}
                      className="w-64 px-4 py-2 bg-slate-800 border border-slate-700 text-white rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-teal-500 focus:border-teal-500 transition duration-150 ease-in-out" />
                  </div>
                )}
                <div className="flex items-center justify-between">
                  <label htmlFor="password-input" className="text-sm font-medium text-slate-300">密碼</label>
                  <input type="password" id="password-input" required value={password} onChange={(e) => setPassword(e.target.value)}
                    className="w-64 px-4 py-2 bg-slate-800 border border-slate-700 text-white rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-teal-500 focus:border-teal-500 transition duration-150 ease-in-out" />
                </div>
                <div className="pt-4">
                  <button type="submit" className="w-full bg-teal-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-teal-500 transition-all duration-300 ease-in-out">
                    {isLoginView ? '登入' : '註冊'}
                  </button>
                </div>
                <button type="button" onClick={() => setIsLoginView(!isLoginView)} className="w-full text-teal-400 hover:text-teal-300 mt-2 text-sm">
                  {isLoginView ? '還沒有帳號？前往註冊' : '已有帳號？返回登入'}
                </button>
              </form>
            </div>
          </div>
        );
      };
      
      const renderIntroContent = () => { return(
          <div className="relative bg-slate-900 border-2 border-teal-500/50 p-12 rounded-2xl shadow-lg shadow-teal-500/20 w-full max-w-2xl text-center">
            <h2 className="text-3xl font-bold text-slate-100 mb-4">歡迎來到 CodeMate！</h2>
            <p className="text-xl text-slate-300 mb-8">{welcomeMessage}</p>
            <p className="text-lg text-slate-200 max-w-2xl mx-auto">
              CodeMate 是一個專為您量身打造的 Python 學習平台。我們提供：
            </p>
            <p className="text-left pl-20 text-slate-300 space-y-2 mt-4">
              <span><strong>豐富的教材</strong>：包含簡報和影片。</span><br />
              <span><strong>適性化聊天機器人</strong>：隨時提問，獲得即時且個人化的解說。</span><br />
              <span><strong>程式執行區</strong>：讓您能立即練習所學。</span><br />
            </p>
            <div className="flex justify-end pt-8">
              <button onClick={() => setPage('learning')} className="bg-teal-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-teal-500 transition-all duration-300 ease-in-out">
                開始學習
              </button>
            </div>
          </div>
      )};
      
      const renderLearningContent = () => {
        const activeTab = tabs.find(tab => tab.id === activeTabId);
        
        return (
          <div className="split-container p-2 gap-2 bg-slate-950">
            {/* 左側區塊 */}
            <div id="left-pane" className="flex flex-col gap-2">
                {/* 教材區 */}
                <div id="material-pane" className="flex flex-col overflow-hidden bg-slate-900 border border-slate-800 rounded-lg">
                    {currentModule?.type === 'video' && <iframe src={currentModule.videoUrl} className="w-full h-full rounded-lg" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen title="Embedded Video"></iframe>}
                    {currentModule?.type === 'ppt' && <iframe src={currentModule.pptUrl} className="w-full h-full rounded-lg" frameBorder="0" allowFullScreen title="Embedded PPT"></iframe>}
                    {currentModule?.type === 'quiz' && (
                      <div className="w-full h-full flex flex-col items-center justify-center p-8 text-center">
                        <h2 className="text-2xl font-bold text-teal-400 mb-4">{currentModule.title}</h2>
                        <p className="text-slate-300 mb-8">{currentModule.content}</p>
                        <button 
                          onClick={() => handleOpenQuiz(currentModule)} // <-- [修改]
                          className="bg-teal-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:bg-teal-700 transition-all"
                        >
                          {quizProgress[currentModule.id] ? "再次測驗" : "開始測驗"} {/* <-- [修改] 判斷方式 */}
                        </button>
                        {/* [修改] 顯示更詳細的進度 (可選) */}
                        {quizProgress[currentModule.id] && (
                          <p className="text-slate-400 text-sm mt-4">
                            狀態：已作答
                            (上次作答: {new Date(quizProgress[currentModule.id].lastAttempted).toLocaleString()})
                          </p>
                        )}
                      </div>
                    )}
                    {!currentModule && <div className="w-full h-full rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center"><p>請選擇一個課程單元</p></div>}
                </div>
                {/* 聊天機器人區 */}
                <div id="chat-pane" className="flex flex-col bg-slate-900 rounded-lg p-4 border border-slate-800">
                    <div className="flex-1 overflow-y-auto bg-slate-950 rounded-lg p-3 shadow-sm mb-4">
                        {chatMessages.map((msg) => (
                        <div key={msg.id} className={`mb-3 p-3 rounded-lg max-w-[90%] text-sm shadow-sm ${msg.sender === 'user' ? 'bg-teal-600 text-white ml-auto rounded-br-none' : 'bg-slate-700 text-slate-200 rounded-bl-none'}`}>
                            <div className="prose prose-invert prose-sm max-w-none" dangerouslySetInnerHTML={{ __html: marked.parse(msg.content) }}></div>
                            <div className={`text-xs mt-1 text-right ${msg.sender === 'user' ? 'text-teal-200' : 'text-slate-400'}`}>{new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        </div>
                        ))}
                        <div ref={messagesEndRef} />
                    </div>
                    <div className="flex gap-2">
                        <textarea
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          onCompositionStart={() => isComposing.current = true}
                          onCompositionEnd={() => isComposing.current = false}
                          onKeyDown={(e) => {
                              if (e.key === 'Enter' && !e.shiftKey && !isComposing.current) {
                                  e.preventDefault();
                                  handleSendChat();
                              }
                          }}
                          placeholder={isAiResponding ? "AI 助教正在回覆..." : "輸入你的問題..."}
                          className="flex-1 p-2 bg-slate-800 border border-slate-700 text-white rounded-lg resize-none focus:ring-1 focus:ring-teal-500 focus:border-teal-500 disabled:bg-slate-700"
                          rows="1"
                          disabled={isAiResponding}
                        />
                        <button onClick={handleSendChat} disabled={!chatInput.trim() || isAiResponding} className="bg-teal-600 text-white px-4 rounded-lg hover:bg-teal-700 disabled:bg-slate-600 flex items-center justify-center">
                          <Icon name="send" className="w-5 h-5"/>
                        </button>
                    </div>
                </div>
            </div>
            
            {/* 右側區塊 */}
            <div id="right-pane" className="h-full flex flex-col bg-slate-900 rounded-lg border border-slate-800">
                  <div className="flex border-b border-slate-800 p-2 items-center gap-2 overflow-x-auto">
                      {tabs.map(tab => (
                          <div key={tab.id} onClick={() => setActiveTabId(tab.id)} className={`flex-shrink-0 flex items-center py-2 px-3 rounded-md cursor-pointer text-sm ${activeTabId === tab.id ? 'bg-slate-800' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                              <span>{tab.title}</span>
                              <button onClick={(e) => {e.stopPropagation(); handleRemoveTab(tab.id);}} className="ml-2 text-slate-500 hover:text-red-400 text-xs">✕</button>
                          </div>
                      ))}
                      <div className="ml-auto flex items-center gap-2 flex-shrink-0">
                        <button onClick={() => handleAddTab('code')} className="text-xs bg-teal-500/10 text-teal-300 px-3 py-1 rounded-full hover:bg-teal-500/20">+ Code</button>
                        <button onClick={() => handleAddTab('note')} className="text-xs bg-amber-500/10 text-amber-300 px-3 py-1 rounded-full hover:bg-amber-500/20">+ Note</button>
                      </div>
                  </div>
                  {/* Tab 內容區 */}
                  <div className="flex-1 p-2 overflow-hidden flex flex-col"> {/* 改為 flex flex-col */}
                      {activeTab?.type === 'code' && (
                          <div className="h-full flex flex-col">
                              {/* CodeMirror 編輯器 (保持高度為一半) */}
                              <div className="flex-1 h-1/2 overflow-hidden">
                                  <CodeMirrorEditor
                                      activeTab={activeTab}
                                      handleTabContentChange={handleTabContentChange}
                                      handleCodeKeyDown={handleCodeKeyDown}
                                  />
                              </div>
                                {/* 輸出/錯誤/輸入區 (佔用剩餘一半空間) */}
                              <div className="h-1/2 flex flex-col pt-2 gap-2 overflow-y-auto"> {/* 新增 overflow-y-auto */}
                                  {/* 執行/下載按鈕 */}
                                  <div className="flex items-center gap-2 flex-shrink-0">
                                      <button
                                          onClick={() => handleRunCode(activeTab.id)}
                                          disabled={!activeTab || isExecuting} // 使用 isExecuting 狀態
                                          className="bg-green-600 text-white py-1 px-3 rounded hover:bg-green-700 text-sm disabled:bg-slate-500 self-start"
                                      >
                                          {isExecuting ? '執行中...' : '執行'}
                                      </button>
                                      <button
                                          onClick={() => handleDownloadTabContent(activeTab)}
                                          className="bg-blue-600 text-white py-1 px-3 rounded hover:bg-blue-700 text-sm self-start"
                                      >
                                          下載檔案
                                      </button>
                                  </div>
                                  {/* 輸出/錯誤顯示區 */}
                                  <div className="flex-1 text-sm space-y-2">
                                      {/* --- 🔽 [修改] 顯示輸出或錯誤 --- */}
                                      {(activeTab.output || activeTab.error) && (
                                          <div>
                                              <strong className={activeTab.error ? "text-red-400" : "text-slate-300"}>
                                                  {activeTab.error ? '錯誤:' : '輸出:'}
                                              </strong>
                                              {/* 使用 pre 標籤顯示，保留換行和空格 */}
                                              <pre className={`rounded !mt-1 !p-4 !font-mono !text-sm whitespace-pre-wrap ${activeTab.error ? 'bg-red-900/50 text-red-300' : 'bg-slate-800 text-slate-200'}`}>
                                                  <code>{activeTab.output || activeTab.error}</code>
                                              </pre>
                                          </div>
                                      )}
                                      {/* --- 🔼 [修改] -------------------- */}
                                  </div>
                                    {/* --- 🔽 [新增] 終端機輸入框 --- */}
                                    {isExecuting && ( // 只在執行中顯示輸入框
                                      <div className="mt-auto pt-2 flex-shrink-0">
                                          <input
                                              ref={terminalInputRef}
                                              type="text"
                                              onKeyDown={handleTerminalInput}
                                              className="terminal-input"
                                              disabled={!isWaitingForInput} // (可選，如果希望只有在明確等待時才能輸入)
                                          />
                                      </div>
                                    )}
                                    {/* --- 🔼 [新增] -------------------- */}
                              </div>
                          </div>
                      )}
                      {activeTab?.type === 'note' && (
                          <div className="h-full flex flex-col bg-slate-800 rounded-md">
                            <textarea
                                value={activeTab.content}
                                onChange={e => handleTabContentChange(activeTab.id, e.target.value)}
                                className="w-full p-2 bg-transparent border-none text-slate-200 resize-none flex-1"
                                placeholder="輸入你的筆記..."
                            />
                            <div className="p-2 border-t border-slate-700 flex justify-start">
                                <button 
                                    onClick={() => handleDownloadTabContent(activeTab)}
                                    className="bg-blue-600 text-white py-1 px-3 rounded hover:bg-blue-700 text-sm"
                                >
                                    下載筆記
                                </button>
                            </div>
                          </div>
                      )}
                      {!activeTab && <div className="text-slate-500 p-4">請新增一個分頁開始。</div>}
                  </div>
            </div>
          </div>
        );
      };

      const renderSidebar = () => {
        if (page !== 'learning') return null;

        return (
            <div className={`flex-shrink-0 flex flex-col bg-slate-900 text-slate-300 shadow-lg transition-all duration-300 ${isSidebarOpen ? 'w-1/5 p-4' : 'w-16 p-2'}`}>
                {isSidebarOpen && (
                    <>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-xl font-bold text-slate-100">課程列表</h2>
                            <button onClick={() => setIsSidebarOpen(false)} className="p-1 rounded-md text-slate-400 hover:bg-slate-800">
                                <Icon name="menu" className="w-6 h-6"/>
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto -mr-2 pr-2">
                        {courses.map(course => (
                        <div key={course.id} className="mb-3">
                            <div onClick={() => handleCourseSelect(course)} className={`p-3 rounded-lg cursor-pointer transition-all ${selectedCourse?.id === course.id ? 'bg-slate-800' : 'hover:bg-slate-800'}`}>
                            <h3 className="font-semibold text-slate-200">{course.title}</h3>
                            </div>
                            {selectedCourse?.id === course.id && (
                            <div className="mt-2 pl-2 space-y-1">
                                {modules.map(module => module.submodules ? (
                                <div key={module.id}>
                                    <div onClick={() => toggleModuleExpansion(module.id)} className="flex justify-between items-center p-2 rounded-md cursor-pointer hover:bg-slate-800">
                                        <span className="font-medium text-sm">{module.title}</span>
                                        <Icon name="chevron" className="w-5 h-5 text-slate-400" isExpanded={expandedModules[module.id]} />
                                    </div>
                                    {expandedModules[module.id] && (
                                        <div className="pl-4 mt-1 border-l-2 border-slate-700 space-y-1">
                                            {module.submodules.map(submodule => (
                                              <div 
                                                key={submodule.id} 
                                                onClick={() => handleModuleSelect(submodule)} 
                                                className={`flex justify-between items-center p-2 rounded-md cursor-pointer text-xs transition-all ${currentModule?.id === submodule.id ? 'bg-teal-600 font-semibold text-white' : 'hover:bg-slate-800'}`}
                                              >
                                                <span>{submodule.title}</span>
                                                {submodule.type === 'quiz' && quizProgress[submodule.id] && (
                                                  <span title="已作答" className="text-green-400">✓</span>
                                                )}
                                              </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                ) : (
                                <div key={module.id} onClick={() => handleModuleSelect(module)} className={`p-2 rounded-md cursor-pointer text-sm transition-all ${currentModule?.id === module.id ? 'bg-teal-600 font-semibold text-white' : 'hover:bg-slate-800'}`}>
                                    {module.title}
                                </div>
                                ))}
                            </div>
                            )}
                        </div>
                        ))}
                    </div>
                    </>
                )}
                {!isSidebarOpen && (
                    <div className="flex flex-col items-center">
                        <button onClick={() => setIsSidebarOpen(true)} className="p-2 rounded-lg hover:bg-slate-800" title="展開課程列表">
                           <Icon name="menu" className="w-6 h-6"/>
                        </button>
                    </div>
                )}
            </div>
        )
      }

      const renderContent = () => {
        switch (page) {
          case 'auth': return renderAuthContent();
          case 'intro': return <div className="flex items-center justify-center h-full">{renderIntroContent()}</div>;
          case 'learning': return renderLearningContent();
          default: return renderAuthContent();
        }
      };

      return (
        <div className="h-full flex flex-col">
            <header className="h-14 bg-slate-900 border-b border-slate-800 shadow-md z-10 flex items-center justify-between px-6 flex-shrink-0">
                <div className="flex items-center gap-4">
                    <h1 className="text-2xl font-bold text-teal-400">CodeMate</h1>
                </div>
                {isLoggedIn && (
                    <button onClick={handleLogout} className="bg-red-600 text-white font-semibold py-1.5 px-4 rounded-lg shadow-md hover:bg-red-700 text-sm">
                        登出
                    </button>
                )}
            </header>
            <div className="flex flex-1 overflow-hidden">
                {renderSidebar()}
                <main className="flex-1 overflow-y-auto">
                    {renderContent()}
                </main>
            </div>
          
          {showMessage && (
            <div className="fixed top-5 right-5 bg-slate-800 border border-slate-700 text-white px-4 py-2 rounded-lg shadow-lg z-50 animate-pulse">
              {message}
            </div>
          )}
          {renderQuizModal()}
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
</script>

</body>
</html>
