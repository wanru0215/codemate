    function CodeMirrorEditor({ activeTab, handleTabContentChange, handleCodeKeyDown, isDarkMode }) { // 🔥 這裡新增接收 isDarkMode
      const editorRef = React.useRef(null);
      const cmInstance = React.useRef(null);
      
      const onChangeRef = React.useRef(handleTabContentChange);
      const onKeyDownRef = React.useRef(handleCodeKeyDown);

      React.useEffect(() => {
          onChangeRef.current = handleTabContentChange;
          onKeyDownRef.current = handleCodeKeyDown;
      }, [handleTabContentChange, handleCodeKeyDown]);

      // --- 初始化 ---
      React.useEffect(() => {
          if (editorRef.current && !cmInstance.current) {
                  const mode = activeTab?.fileName ? getCodeMirrorMode(activeTab.fileName) : "python";

                  cmInstance.current = window.CodeMirror.fromTextArea(editorRef.current, {
                      mode: mode,
                      theme: isDarkMode ? "dracula" : "default", // ✅ 現在讀得到 isDarkMode 了
                  lineNumbers: true,
                  indentUnit: 4,
                  tabSize: 4,
                  indentWithTabs: false,
                  smartIndent: true,
                  extraKeys: {
                    Tab: function(cm) {
                      if (cm.somethingSelected()) {
                        cm.indentSelection("add");
                      } else {
                        cm.replaceSelection("    ", "end");
                      }
                    },
                    Backspace: function(cm) {
                      const spacesPerIndent = cm.getOption("indentUnit");
                      const cursor = cm.getCursor();
                      const line = cm.getLine(cursor.line);
                      const beforeCursor = line.slice(0, cursor.ch);
                      if (/^\s+$/.test(beforeCursor) && (beforeCursor.length % spacesPerIndent === 0)) {
                        cm.replaceRange("", { line: cursor.line, ch: cursor.ch - spacesPerIndent }, { line: cursor.line, ch: cursor.ch });
                      } else {
                        cm.execCommand("delCharBefore");
                      }
                    }
                  },
                  autoCloseBrackets: true,
                  matchBrackets: true
              });
          }
          return () => {
              if (cmInstance.current) {
                  cmInstance.current.toTextArea();
                  cmInstance.current = null;
              }
          };
      }, []);

      // 🔥 [新增] 監聽深淺色切換，動態改變編輯器主題
      React.useEffect(() => {
          if (cmInstance.current) {
              cmInstance.current.setOption("theme", isDarkMode ? "dracula" : "default");
          }
      }, [isDarkMode]);

      // --- 以下內容保持不變 (重新綁定監聽器與同步內容的邏輯) ---
      React.useEffect(() => {
          if (cmInstance.current) {
              const changeHandler = (cm) => { if (activeTab) onChangeRef.current(activeTab.id, cm.getValue()); };
              const keydownHandler = (cm, event) => { if (activeTab) onKeyDownRef.current(cm, event, activeTab.id); };
              cmInstance.current.off("change", cmInstance.current.__changeHandler);
              cmInstance.current.off("keydown", cmInstance.current.__keydownHandler);
              cmInstance.current.on("change", changeHandler);
              cmInstance.current.on("keydown", keydownHandler);
              cmInstance.current.__changeHandler = changeHandler;
              cmInstance.current.__keydownHandler = keydownHandler;
              return () => {
                  if (cmInstance.current) {
                      cmInstance.current.off("change", changeHandler);
                      cmInstance.current.off("keydown", keydownHandler);
                  }
              };
          }
      }, [activeTab, onChangeRef, onKeyDownRef]);

      React.useEffect(() => {
          if (cmInstance.current && activeTab) {
              const newMode = activeTab.fileName ? getCodeMirrorMode(activeTab.fileName) : "python";
              const currentMode = cmInstance.current.getOption("mode");
              if (JSON.stringify(newMode) !== JSON.stringify(currentMode)) {
                  cmInstance.current.setOption("mode", newMode);
              }
          }
      }, [activeTab]);

      React.useEffect(() => {
          if (cmInstance.current) {
              const currentVal = cmInstance.current.getValue();
              if (activeTab && activeTab.content !== currentVal) {
                  const cursor = cmInstance.current.getCursor();
                  cmInstance.current.off("change", cmInstance.current.__changeHandler);
                  cmInstance.current.setValue(activeTab.content);
                  cmInstance.current.on("change", cmInstance.current.__changeHandler);
                  try { cmInstance.current.setCursor(cursor); } catch (e) { cmInstance.current.setCursor(cmInstance.current.lineCount(), 0); }
                  setTimeout(() => cmInstance.current.focus(), 0);
              } else if (!activeTab && currentVal !== '') {
                  cmInstance.current.setValue('');
              }
          }
      }, [activeTab]);

      return ( <textarea ref={editorRef} style={{ display: 'none' }} /> );
    }

      const getInitialPage = () => {
        const hash = window.location.hash.substring(1);
        const validPages = ['auth', 'intro', 'learning'];
        const storedId = localStorage.getItem('studentId');
        if (validPages.includes(hash)) {
          if ((hash === 'intro' || hash === 'learning') && !storedId) return 'auth';
          return hash;
        }
        return storedId ? 'intro' : 'auth';
      };
      
      const [page, setPage] = useState(getInitialPage);

      useEffect(() => {
        const initialPage = getInitialPage();
        setPage(initialPage);
        window.history.replaceState({ page: initialPage }, '', `#${initialPage}`);
        const storedId = localStorage.getItem('studentId');
        const storedName = localStorage.getItem('studentName');

          setStudentId(storedId);
          setWelcomeMessage(`歡迎回來, ${storedName} (${storedId})!`);
        }
      }, []);
      
      useEffect(() => {
        const handlePopState = (event) => {
          setPage((event.state && event.state.page) ? event.state.page : getInitialPage());
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      useEffect(() => {
        const currentHash = window.location.hash.substring(1);
        if (page !== currentHash) {
          window.history.pushState({ page: page }, '', `#${page}`);

             if (res.ok) setWorksheetAnswers(await res.json());

          // 4. 🔥 [修改] 載入課程與 Tabs (優先從資料庫讀取)
          setCourses(mockCourses);
          const defaultTab = { id: 1, type: 'code', title: 'Code 1', content: '', output: '', error: '' };
          
          let loadedData = null;

          // A. 嘗試從後端資料庫讀取
          try {
              const res = await fetch(`/api/workspace/load/${currentStudentId}`);
              if (res.ok) {
                  const dbData = await res.json();
                  // 檢查資料庫裡是否有有效的 Tabs 資料
                  if (dbData && dbData.tabs && Array.isArray(dbData.tabs) && dbData.tabs.length > 0) {

              }
          } catch (e) {

          }

          // B. 如果資料庫沒資料，嘗試 LocalStorage (備用)
          if (!loadedData) {
              const localRaw = localStorage.getItem(`progress_${currentStudentId}`);
              if (localRaw) {
                  try {
                      loadedData = JSON.parse(localRaw);

          // C. 執行還原邏輯
          if (loadedData) {
            try {

              const lastCourse = mockCourses.find(c => c.id === loadedData.lastCourseId) || mockCourses[0];
              const courseModules = mockModules[lastCourse.id] || [];
              const lastModuleId = loadedData.lastModuleId;
              let lastModule = null;
              let parentModule = null;

              for (const module of courseModules) {
                  if (module.id === lastModuleId) { lastModule = module; break; }
                  if (module.submodules) {
                      const foundSub = module.submodules.find(sm => sm.id === lastModuleId);
                      if (foundSub) { lastModule = foundSub; parentModule = module; break; }
                  }
              }
              if (!lastModule && courseModules.length > 0) {
                  const firstModule = courseModules[0];
                  lastModule = firstModule.submodules && firstModule.submodules.length > 0 ? firstModule.submodules[0] : firstModule;
                  if (firstModule.submodules) parentModule = firstModule;

                                <button 
                                    onClick={() => handleDownloadTabContent(activeTab)}
                                    className="text-xs bg-blue-100 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300 px-3 py-1 rounded-full hover:bg-blue-200 dark:hover:bg-teal-500/20 border border-blue-200 dark:border-transparent transition-colors"
                                >
                                    Download Note
                                </button>
                            </div>
                          </div>
                      )}
					  {activeTab?.type === 'feedback' && (
                          <div className="h-full flex flex-col border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-md transition-colors">
                              {/* 移除 prose-invert，改用 prose dark:prose-invert 以自動切換 Markdown 文字顏色 */}
                              <div className="flex-1 p-4 overflow-y-auto prose dark:prose-invert max-w-none text-sm text-slate-800 dark:text-slate-200">
                                  <div dangerouslySetInnerHTML={{ __html: marked.parse(activeTab.content) }}></div>
                              </div>
                              <div className="p-2 border-t border-slate-200 dark:border-slate-700 flex justify-start gap-2 bg-slate-50 dark:bg-slate-900/50">
                                  <button 
                                      onClick={() => handleRemoveTab(activeTab.id)}
                                      className="text-xs bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 px-3 py-1 rounded-full hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors"
                                  >
                                      關閉建議
                                  </button>
                                  {/* 修改輔助文字顏色：確保在淺色模式也有足夠對比度 */}
                                  <span className="text-xs text-slate-500 dark:text-slate-400 self-center">您可以對照左側學習單進行修改</span>
                              </div>
                          </div>
                      )}
                      {!activeTab && <div className="text-sm text-slate-500 p-4">請新增一個分頁開始。</div>}
                  </div>
            </div>
            {/* 🔽 [新增] 全域懸浮 Tooltip (Fixed 定位，不會被 overflow 切掉) */}
            {globalTooltip.show && (
                <div 
                    className="fixed z-[100] px-2 py-1 bg-slate-800 text-slate-300 text-xs rounded border border-slate-600 shadow-xl pointer-events-none whitespace-nowrap font-sans"
                    style={{ 
                        top: globalTooltip.y, 
                        left: globalTooltip.x,
                        // 🔥 關鍵修改：如果是 'top'，要往上平移 100% (translateY -100%)
                        transform: globalTooltip.placement === 'top' 
                            ? 'translate(-50%, -100%)' 
                            : 'translate(-50%, 0)'
                    }}
                >
                    {globalTooltip.text}
                </div>
            )}
          </div>
        );
      };

      const renderSidebar = () => {
        if (page !== 'learning') return null;

        return (
            <div className={`h-full flex-shrink-0 flex flex-col bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-300 border-r border-slate-200 dark:border-slate-800 shadow-lg transition-all duration-300 ${isSidebarOpen ? 'w-64 p-4' : 'w-16 p-2'}`}>
                {isSidebarOpen && (
                    <>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">課程列表</h2>
                            <button 
                                onClick={() => setIsSidebarOpen(false)} 
                                className="p-1 rounded-md text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                                onMouseEnter={(e) => handleShowTooltip(e, '收起課程列表', 'top')}
                                onMouseLeave={handleHideTooltip}
                            >
                                <Icon name="menu" className="w-6 h-6"/>
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto -mr-2 pr-2">
                        {displayedCourses.map(course => (
                        <div key={course.id} className="mb-3">
                            <div 
                              onClick={() => handleCourseSelect(course)} 
                              className={`p-3 rounded-lg cursor-pointer transition-all border-2 ${
                                selectedCourse?.id === course.id 
                                ? 'bg-teal-100 dark:bg-slate-800 border-teal-600 dark:border-teal-500 shadow-md' 
                                : 'bg-transparent border-transparent hover:bg-slate-100 dark:hover:bg-slate-800'
                              }`}
                            >
                            <h3 className="font-semibold text-slate-800 dark:text-slate-200">{course.title}</h3>
                            </div>
                            {selectedCourse?.id === course.id && (
                            <div className="mt-2 pl-2 space-y-1">
                                {modules.map(module => module.submodules ? (
                                <div key={module.id}>
                                    <div onClick={() => toggleModuleExpansion(module.id)} className="flex justify-between items-center p-2 rounded-md cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300">
                                        <span className="font-medium text-sm">{module.title}</span>
                                        <Icon name="chevron" className="w-5 h-5 text-slate-400" isExpanded={expandedModules[module.id]} />
                                    </div>
                                    {expandedModules[module.id] && (
                                        <div className="pl-4 mt-1 border-l-2 border-slate-700 space-y-1">
                                            {module.submodules.map(submodule => (
                                              <div 
                                                key={submodule.id} 
                                                onClick={() => handleModuleSelect(submodule)} 
                                                // [修改後] 方案一：淡色背景
                                                className={`flex justify-between items-center p-2 rounded-md cursor-pointer text-xs transition-all ${
                                                    currentModule?.id === submodule.id 
                                                    ? 'bg-teal-600 text-white dark:bg-teal-500/20 dark:text-teal-300 font-semibold shadow-sm' 
                                                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-200'
                                                }`}
                                              >
                                                <span>{submodule.title}</span>
                                                {submodule.type === 'quiz' && quizProgress[submodule.id] && (
                                                  <span title="已作答" className="text-red-500">✓</span>
                                                )}
                                              </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                ) : (
                                <div key={module.id} onClick={() => handleModuleSelect(module)} className={`p-2 rounded-md cursor-pointer text-sm transition-all ${currentModule?.id === module.id ? 'bg-teal-600 font-semibold text-white' : 'hover:bg-slate-800'}`}>
                                    {module.title}
                                </div>
                                ))}
                            </div>
                            )}
                        </div>
                        ))}
                    </div>
                    </>
                )}
                {!isSidebarOpen && (
                    <div className="flex flex-col items-center">
                        <button 
                            onClick={() => setIsSidebarOpen(true)} 
                            className="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                            onMouseEnter={(e) => handleShowTooltip(e, '展開課程列表', 'top')}
                            onMouseLeave={handleHideTooltip}
                        >
                              <Icon name="menu" className="w-6 h-6"/>
                        </button>
                    </div>
                )}
            </div>
        )
      }

      const renderContent = () => {
        switch (page) {
          case 'auth': return renderAuthContent();
          case 'intro': return <div className="flex items-center justify-center h-full">{renderIntroContent()}</div>;
          case 'learning': return renderLearningContent();
          default: return renderAuthContent();
        }
      };

      return (
        <div className="h-full flex flex-col bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">
            <header className="h-14 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-md z-10 flex items-center justify-between px-6 flex-shrink-0 transition-colors duration-300">
                <div className="flex items-center gap-4">
                    <h1 className="text-2xl font-bold text-teal-600 dark:text-teal-400">CodeMate</h1>
                    
                    {/* 🔥 [新增] 學習區的深淺色切換按鈕 */}
                    <button
                        onClick={() => setIsDarkMode(!isDarkMode)}
                        className="p-1.5 ml-2 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                        title="切換深淺色模式"
                    >
                        <Icon name={isDarkMode ? "sun" : "moon"} className="w-5 h-5" />
                    </button>
                </div>
                {isLoggedIn && (
                    <button onClick={handleLogout} className="text-sm font-bold border border-red-500 bg-red-50 dark:bg-red-500/20 text-red-500 px-3 py-1 rounded-full hover:bg-red-100 dark:hover:bg-red-500/30 transition-colors">
                        LogOut
                    </button>
                )}
            </header>
            <div className="flex flex-1 overflow-hidden">
                {renderSidebar()}
                <main className="flex-1 overflow-y-auto">
                    {renderContent()}
                </main>
            </div>
          
          {showMessage && (
            <div className="fixed top-5 right-5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white px-4 py-2 rounded-lg shadow-xl z-50 animate-pulse transition-colors duration-300">
              {message}
            </div>
          )}
          {renderQuizModal()}
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
</script>

</body>
</html>
