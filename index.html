        .code-textarea {
            background: #f8f9fa;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem; /* rounded-md */
            overflow-y: auto !important;
            resize: none; /* Disable manual resizing */
            padding: 10px;
        }
        .code-textarea {
            min-height: 150px;
            max-height: 300px;
        }
        .prose pre {
            background-color: #f1f3f5;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        .feedback-btn {
            background-color: #e2e8f0;
            border-radius: 50%;
            padding: 0.25rem;
            transition: background-color 0.2s;
        }
        .feedback-btn:hover {
            background-color: #cbd5e1;
        }
        .feedback-btn.selected {
            background-color: #4299e1;
            color: white;
        }

                    { id: 20308, title: "Ch12 PPT", type: 'ppt', content: "類別物件導向程式設計簡報。", pptUrl: "https://drive.google.com/file/d/1gUfZM9TLjHELdU8NvuthXZYs_q-PzpoZ/preview" }

                    { id: 20402, title: "影片 14-2", type: 'video', content: "ch14-2", videoUrl: "https://drive.google.com/file/d/1GwIiw165_Tt9z9bWYTisYR9ia5mo-K6T/preview" },
                    { id: 20403, title: "影片 14-3", type: 'video', content: "ch14-3", videoUrl: "https://drive.google.com/file/d/1WPkgNbji005sMnkkZ9I0qAl1y1YsbI0e/preview" },
                    { id: 20404, title: "影片 14-4", type: 'video', content: "ch14-4", videoUrl: "https://drive.google.com/file/d/1XI9mRLRDyx5E7qZTX3MrCfkrGMcZdueZ/preview" },
                    { id: 20405, title: "影片 14-5", type: 'video', content: "ch14-5", videoUrl: "https://drive.google.com/file/d/1Y1JDQOvJsCqX0HZDTGS0E2V59E1yMCAa/preview" },
                    { id: 20406, title: "影片 14-6", type: 'video', content: "ch14-6", videoUrl: "https://drive.google.com/file/d/13zBnQIJ26OhibKDRCX1RcM4-e04tmXmX/preview" },
                    { id: 20407, title: "影片 14-7", type: 'video', content: "ch14-7", videoUrl: "https://drive.google.com/file/d/1-omN2XyOuE7ET9j3jq1W95bWo0TeNqnx/preview" },
                    { id: 20408, title: "影片 14-8", type: 'video', content: "ch14-8", videoUrl: "https://drive.google.com/file/d/19xXOBsR8BgIH8-oNsyWik3SlmU7hk4pM/preview" },
                    { id: 20409, title: "影片 14-9", type: 'video', content: "ch14-9", videoUrl: "https://drive.google.com/file/d/1o7ipa5R9uK42YvSJJhcbQrEWeoYB0TzM/preview" },
                    { id: 20410, title: "影片 14-10", type: 'video', content: "ch14-10", videoUrl: "https://drive.google.com/file/d/1o7ipa5R9uK42YvSJJhcbQrEWeoYB0TzM/preview" },
                    { id: 20411, title: "Ch14 PPT", type: 'ppt', content: "檔案的讀取與寫入簡報。", pptUrl: "https://drive.google.com/file/d/1Bvq6ZdAvAm2oF-ktLWeVLiCEtSNGB8xH/preview" }
                    
                ]
              },
              { 
                id: 205, 
                title: "第15章．程式除錯與異常處理",
                submodules: [
                    { id: 2051, title: "影片 15-1", type: 'video', content: "ch15-1", videoUrl: "https://drive.google.com/file/d/1GGa9vT1UulGGzAWquIv9zDO9cma_OeN1/preview" },
                    { id: 2052, title: "影片 15-2", type: 'video', content: "ch15-2", videoUrl: "https://drive.google.com/file/d/1WlJweU-1R8MMfyfzahyo2qY-E1NtRO5V/preview" },
                    { id: 2053, title: "影片 15-3", type: 'video', content: "ch15-3", videoUrl: "https://drive.google.com/file/d/1uLjefZmxU-dVgVtstpKn1WU-bDO1J0yT/preview" },
                    { id: 2054, title: "Ch15 PPT", type: 'ppt', content: "程式除錯與異常處理簡報。", pptUrl: "https://drive.google.com/file/d/15CCKPpCGoOAlvDBOFXmp_rf5-JZir3he/preview" }
                    
                ]
              }
          ]
      };

      const getInitialPage = () => {
        const hash = window.location.hash.substring(1);
        const validPages = ['auth', 'intro', 'learning'];
        const storedId = localStorage.getItem('studentId');
        if (validPages.includes(hash)) {
          if ((hash === 'intro' || hash === 'learning') && !storedId) return 'auth';
          return hash;
        }
        return storedId ? 'intro' : 'auth';
      };
      
      const [page, setPage] = useState(getInitialPage);

      useEffect(() => {
        const initialPage = getInitialPage();
        setPage(initialPage);
        window.history.replaceState({ page: initialPage }, '', `#${initialPage}`);
        const storedId = localStorage.getItem('studentId');
        const storedName = localStorage.getItem('studentName');
        if (storedId && storedName) {
          setIsLoggedIn(true);
          setStudentId(storedId);
          setWelcomeMessage(`歡迎回來, ${storedName} (${storedId})!`);
        }
      }, []);
      
      useEffect(() => {
        const handlePopState = (event) => {
          setPage((event.state && event.state.page) ? event.state.page : getInitialPage());
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      useEffect(() => {
        const currentHash = window.location.hash.substring(1);
        if (page !== currentHash) {
          window.history.pushState({ page: page }, '', `#${page}`);
        }
      }, [page]);
      
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages]);

      useEffect(() => {
        if (page === 'learning' && isLoggedIn && studentId) {
          setCourses(mockCourses);
          const savedProgressRaw = localStorage.getItem(`progress_${studentId}`);

          if (savedProgressRaw) {
            try {
              const savedProgress = JSON.parse(savedProgressRaw);
              
              const lastCourse = mockCourses.find(c => c.id === savedProgress.lastCourseId) || mockCourses[0];
              if (!lastCourse) {
                  console.error("No courses available to load progress from.");
                  return;
              }
              
              const courseModules = mockModules[lastCourse.id] || [];
              
              const lastModuleId = savedProgress.lastModuleId;
              let lastModule = null;
              let parentModule = null;

              for (const module of courseModules) {
                  if (module.id === lastModuleId) { lastModule = module; break; }
                  if (module.submodules) {
                      const foundSub = module.submodules.find(sm => sm.id === lastModuleId);
                      if (foundSub) { lastModule = foundSub; parentModule = module; break; }
                  }
              }

              if (!lastModule && courseModules.length > 0) {
                  const firstModule = courseModules[0];
                  lastModule = firstModule.submodules && firstModule.submodules.length > 0 ? firstModule.submodules[0] : firstModule;
                  if (firstModule.submodules) parentModule = firstModule;
              }
              
              setSelectedCourse(lastCourse);
              setModules(courseModules);
              setCurrentModule(lastModule);
              if (parentModule) {
                  setExpandedModules(prev => ({ ...prev, [parentModule.id]: true }));
              }
              
              if (savedProgress.tabs && Array.isArray(savedProgress.tabs) && savedProgress.tabs.length > 0) {
                  setTabs(savedProgress.tabs);
                  setActiveTabId(savedProgress.activeTabId || savedProgress.tabs[0].id);
                  setNextTabId((Math.max(...savedProgress.tabs.map(t => parseInt(t.id, 10))) || 0) + 1);
              } else if (lastModule) {
                  handleModuleSelect(lastModule, true);
              }
              
              setChatMessages(savedProgress.chat && Array.isArray(savedProgress.chat) ? savedProgress.chat : [{ id: 0, sender: 'ai', content: '哈囉！今天有什麼 Python 問題可以幫助您的嗎？', timestamp: new Date().toISOString() }]);

            } catch (error) {
              console.error("讀取進度失敗，將重設為預設值:", error);
              localStorage.removeItem(`progress_${studentId}`);
              if (mockCourses.length > 0) handleCourseSelect(mockCourses[0]);
            }
          } else {
            if (mockCourses.length > 0) handleCourseSelect(mockCourses[0]);
          }
        }
      }, [page, isLoggedIn, studentId]);

      useEffect(() => {
          if (page === 'learning' && isLoggedIn && currentModule && studentId) {
              const progress = {
                  lastCourseId: selectedCourse?.id,
                  lastModuleId: currentModule.id,
                  tabs: tabs,
                  activeTabId: activeTabId,
                  chat: chatMessages
              };
              localStorage.setItem(`progress_${studentId}`, JSON.stringify(progress));
          }
      }, [tabs, activeTabId, currentModule, chatMessages, studentId]);

      const showMessageModal = (msg) => {
        setMessage(msg);
        setShowMessage(true);
        setTimeout(() => setShowMessage(false), 2000);
      };

      const handleLogout = () => {
        localStorage.removeItem('studentId');
        localStorage.removeItem('studentName');
        localStorage.removeItem(`progress_${studentId}`);
        setIsLoggedIn(false);
        setPage('auth');
        setStudentId('');
        setStudentName('');
        setPassword('');
        setCourses([]);
        setTabs([]);
        setActiveTabId(null);
        setChatMessages([{ id: 0, sender: 'ai', content: '哈囉！今天有什麼 Python 問題可以幫助您的嗎？', timestamp: new Date().toISOString() }]);
        showMessageModal('您已成功登出。');
      };

      const handleAction = async (event) => {
        event.preventDefault();

        if (!studentId.trim() || !password.trim() || (!isLoginView && !studentName.trim())) {
          showMessageModal('所有欄位皆為必填。');
          return;
        }

        const backendUrl = 'http://localhost:3000';
        const endpoint = isLoginView ? `${backendUrl}/api/login` : `${backendUrl}/api/register`;
        const payload = isLoginView ? { studentId, password } : { studentId, name: studentName, password };
        
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();

            if (response.ok) {
                if (isLoginView) {
                    localStorage.setItem('studentId', studentId);
                    localStorage.setItem('studentName', data.name);
                    setIsLoggedIn(true);
                    setWelcomeMessage(`歡迎回來, ${data.name} (${studentId})!`);
                    showMessageModal(data.message || '登入成功！');
                    setPage('intro');
                } else {
                    showMessageModal(data.message || '註冊成功！請使用您的學號登入。');
                    setIsLoginView(true);
                    setStudentId('');
                    setStudentName('');
                    setPassword('');
                }
            } else {
                showMessageModal(`${isLoginView ? '登入' : '註冊'}失敗: ${data.message}`);
            }
        } catch (error) {
            console.error('請求失敗:', error);
            showMessageModal('與伺服器連線失敗，請檢查後端伺服器是否正在運行。');
        }
      };
      
      const saveConversation = async (messagesToSave) => {
        if (!studentId) return;
        try {
            await fetch('http://localhost:3000/api/log/conversation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    studentId: studentId,
                    conversation: messagesToSave
                })
            });
        } catch (error) {
            console.error("無法儲存對話紀錄:", error);
        }
      };

      const handleFeedback = (messageId, feedbackType) => {
        const updatedMessages = chatMessages.map(msg => 
            msg.id === messageId ? { ...msg, feedback: feedbackType } : msg
        );
        setChatMessages(updatedMessages);
        saveConversation(updatedMessages); // Save after feedback
      };

      const handleSendChat = async () => {
        if (!chatInput.trim() || isAiResponding) return;

        setIsAiResponding(true);
        const userMessage = { id: Date.now(), sender: 'user', content: chatInput, timestamp: new Date().toISOString(), feedback: null };
        const thinkingMessageId = Date.now() + 1; 
        const thinkingMessage = { id: thinkingMessageId, sender: 'ai', content: 'AI 助教正在思考...', timestamp: new Date().toISOString(), feedback: null };

        const messagesForApi = [...chatMessages, userMessage];
        setChatMessages([...messagesForApi, thinkingMessage]);
        setChatInput('');

        const apiKey = "AIzaSyCDLdBDxLPL1aK8J6-J5aBw-BN8XttuUzk";
        
        if (!apiKey || apiKey === "請在這裡貼上您的 Google AI Studio API 金鑰") {
            const errorMessage = "診斷：API 金鑰未設定。請在程式碼中填入您的 Google AI Studio API 金鑰。";
            setChatMessages(prev => prev.map(msg => msg.id === thinkingMessageId ? { ...msg, content: errorMessage } : msg));
            setIsAiResponding(false);
            return;
        }

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

        const systemPrompt = "你是一位 CodeMate 學習平台上的 Python 程式設計助教。你的核心任務是引導學生完成他們的實作作業，而不是直接給出完整答案。平台上已經有詳細的 PPT 教材，所以你不需要從頭解釋基本概念。當學生提問時，請遵循以下原則：\n1. **不提供完整程式碼**：絕對不要直接給出完整的程式碼解答。\n2. **使用引導式提問**：透過提問來引導學生思考。例如：「你覺得這個迴圈的目的是什麼？」、「這個變數應該在哪裡宣告會比較好？」、「如果輸入是 0，你這段程式會發生什麼事？」\n3. **提供小提示**：給予方向性的提示或相關的關鍵字，讓學生可以自己去查閱 PPT 或思考。例如：「也許你可以回想一下第六章關於 list 的操作方法。」、「這裡可能需要用到 if/else 的判斷喔。」\n4. **分解問題**：引導學生將大問題拆解成數個小步驟來完成。\n5. **保持鼓勵與耐心**：維持友善且鼓勵的語氣，讓學生感覺你是在跟他一起解決問題的夥伴。請務必使用繁體中文回答。";

        const apiHistory = messagesForApi.map(msg => ({
            role: msg.sender === 'ai' ? 'model' : 'user',
            parts: [{ text: msg.content }]
        }));
        
        const payload = { contents: apiHistory, systemInstruction: { parts: [{ text: systemPrompt }] } };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => null); 
                const message = errorData?.error?.message || `API 請求失敗，狀態碼: ${response.status}`;
                throw new Error(message);
            }

            const result = await response.json();
            const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我現在無法回答。";
            
            let finalMessages;
            setChatMessages(prev => {
                finalMessages = prev.map(msg => msg.id === thinkingMessageId ? { ...msg, content: aiText } : msg);
                return finalMessages;
            });
            saveConversation(finalMessages);

        } catch (error) {
            console.error("Gemini API 錯誤:", error);
            const errorMessageContent = `抱歉，發生錯誤：${error.message}`;
            let errorMessages;
            setChatMessages(prev => {
                errorMessages = prev.map(msg => msg.id === thinkingMessageId ? { ...msg, content: errorMessageContent } : msg);
                return errorMessages;
            });
            saveConversation(errorMessages);
        } finally {
            setIsAiResponding(false);
        }
      };

      const handleCourseSelect = (course) => {
        setSelectedCourse(course);
        const courseModules = mockModules[course.id] || [];
        setModules(courseModules);
        setExpandedModules({});
        if (courseModules.length > 0) {
          const firstModule = courseModules[0];
          const initialModule = (firstModule.submodules && firstModule.submodules.length > 0) ? firstModule.submodules[0] : firstModule;
          handleModuleSelect(initialModule);
          if (firstModule.submodules) {
            setExpandedModules({ [firstModule.id]: true });
          }
        } else {
          setCurrentModule(null);
          setTabs([]);
          setActiveTabId(null);
        }
      };
      
      const toggleModuleExpansion = (moduleId) => {
          setExpandedModules(prev => ({...prev, [moduleId]: !prev[moduleId]}));
      };

      const handleModuleSelect = (module, isLoading = false) => {
        setCurrentModule(module);
        if (!isLoading) {
          const newTab = { id: nextTabId, type: 'code', title: 'Code 1', content: '', output: '', error: '' };
          setTabs([newTab]);
          setActiveTabId(newTab.id);
          setNextTabId(prev => prev + 1);
        }
      };
      
      const handleAddTab = (type) => {
        const newTabNumber = tabs.filter(t => t.type === type).length + 1;
        const newTab = {
          id: nextTabId,
          type: type,
          title: type === 'code' ? `Code ${newTabNumber}` : `Note ${newTabNumber}`,
          content: type === 'code' ? '' : '',
          ...(type === 'code' && { output: '', error: '' })
        };
        setTabs([...tabs, newTab]);
        setActiveTabId(newTab.id);
        setNextTabId(prev => prev + 1);
      };

      const handleTabContentChange = (id, newContent) => {
        setTabs(tabs.map(tab => tab.id === id ? { ...tab, content: newContent } : tab));
      };
      
      const handleRunCode = async (tabId) => {
        const tab = tabs.find(t => t.id === tabId);
        if (!tab) return;

        setTabs(prevTabs => prevTabs.map(t => t.id === tabId ? { ...t, output: '執行中...', error: '' } : t));

        try {
            const response = await fetch('http://localhost:3000/api/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: tab.content })
            });

            if (!response.ok) {
                const errorText = await response.text();
                try {
                    const errorJson = JSON.parse(errorText);
                    throw new Error(errorJson.error || `伺服器錯誤: ${response.statusText}`);
                } catch (e) {
                    throw new Error(errorText);
                }
            }

            const result = await response.json();
            setTabs(prevTabs => prevTabs.map(t => t.id === tabId ? { ...t, output: result.output, error: result.error } : t));

        } catch (err) {
            console.error("程式碼執行錯誤:", err);
            setTabs(prevTabs => prevTabs.map(t => t.id === tabId ? { ...t, output: '', error: err.message } : t));
        }
      };
      
      const handleRemoveTab = (id) => {
        const tabToRemoveIndex = tabs.findIndex(tab => tab.id === id);
        const newTabs = tabs.filter(tab => tab.id !== id);
        if (newTabs.length > 0 && activeTabId === id) {
            setActiveTabId(newTabs[Math.max(0, tabToRemoveIndex - 1)].id);
        } else if (newTabs.length === 0) {
            setActiveTabId(null);
        }
        setTabs(newTabs);
      };

      const renderAuthContent = () => {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 className="text-5xl font-extrabold text-blue-600 mb-4 tracking-wide">CodeMate</h1>
            <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm mx-auto border border-gray-200">
              <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">
                {isLoginView ? '學生登入' : '學生註冊'}
              </h2>
              <form className="space-y-6" onSubmit={handleAction}>
                <div className="flex items-center justify-between">
                  <label htmlFor="student-id-input" className="text-sm font-medium text-gray-700">學號</label>
                  <input type="text" id="student-id-input" required value={studentId} onChange={(e) => setStudentId(e.target.value)}
                    className="w-64 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out" />
                </div>
                {!isLoginView && (
                  <div className="flex items-center justify-between">
                    <label htmlFor="student-name-input" className="text-sm font-medium text-gray-700">姓名</label>
                    <input type="text" id="student-name-input" required value={studentName} onChange={(e) => setStudentName(e.target.value)}
                      className="w-64 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out" />
                  </div>
                )}
                <div className="flex items-center justify-between">
                  <label htmlFor="password-input" className="text-sm font-medium text-gray-700">密碼</label>
                  <input type="password" id="password-input" required value={password} onChange={(e) => setPassword(e.target.value)}
                    className="w-64 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out" />
                </div>
                <div className="pt-4">
                  <button type="submit" className="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:from-blue-600 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 ease-in-out">
                    {isLoginView ? '登入' : '註冊'}
                  </button>
                </div>
                <button type="button" onClick={() => setIsLoginView(!isLoginView)} className="w-full text-blue-500 hover:text-indigo-600 mt-2 text-sm">
                  {isLoginView ? '還沒有帳號？前往註冊' : '已有帳號？返回登入'}
                </button>
              </form>
            </div>
          </div>
        );
      };
      
      const renderIntroContent = () => { return(
          <div className="relative bg-white p-12 rounded-2xl shadow-lg w-full max-w-2xl text-center border border-gray-200">
            <h2 className="text-4xl font-bold text-gray-800 mb-4">歡迎來到 CodeMate！</h2>
            <p className="text-xl text-gray-600 mb-8">{welcomeMessage}</p>
            <p className="text-lg text-gray-700 max-w-2xl mx-auto">
              CodeMate 是一個專為您量身打造的 Python 學習平台。我們提供：
            </p>
            <p className="text-left pl-20">
              <strong>豐富的教材</strong>：包含簡報和影片。<br />
              <strong>適性化聊天機器人</strong>：隨時提問，獲得即時且個人化的解說。<br />
              <strong>程式執行區</strong>：讓您能立即練習所學。<br />
            </p>
            <div className="flex justify-end pt-8">
              <button onClick={() => setPage('learning')} className="bg-gradient-to-r from-green-500 to-teal-600 text-white font-semibold py-4 px-8 rounded-lg shadow-lg hover:from-green-600 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all duration-300 ease-in-out">
                開始學習
              </button>
            </div>
          </div>
      )};
      
      const renderLearningContent = () => {
        const activeTab = tabs.find(tab => tab.id === activeTabId);
        
        return (
          <div className="flex h-full w-full p-4 gap-4 bg-white">
            {/* ... (左側和中間區塊的 JSX 與之前相同) ... */}
            <div className="w-3/10 flex flex-col bg-blue-50 rounded-lg p-4 border shadow-inner">
              <h2 className="text-xl font-bold mb-4 text-blue-800">AI 助教</h2>
              <div className="flex-1 overflow-y-auto bg-white rounded-lg p-3 shadow-sm mb-4">
                {chatMessages.map((msg) => (
                  <div key={msg.id}>
                    <div className={`mb-1 p-3 rounded-lg max-w-[90%] text-sm shadow-sm ${msg.sender === 'user' ? 'bg-blue-500 text-white ml-auto rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'}`}>
                      <p>{msg.content}</p>
                      <div className={`text-xs mt-1 text-right ${msg.sender === 'user' ? 'text-blue-200' : 'text-gray-500'}`}>{new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                    {msg.sender === 'ai' && (
                        <div className="flex justify-start gap-2 mb-3 ml-1">
                            <button onClick={() => handleFeedback(msg.id, 'up')} className={`feedback-btn ${msg.feedback === 'up' ? 'selected' : ''}`}>
                                <Icon name="thumb_up" className="w-4 h-4" />
                            </button>
                            <button onClick={() => handleFeedback(msg.id, 'down')} className={`feedback-btn ${msg.feedback === 'down' ? 'selected' : ''}`}>
                                <Icon name="thumb_down" className="w-4 h-4" />
                            </button>
                        </div>
                    )}
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>
              <div className="flex gap-2">
                <textarea
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), handleSendChat())}
                  placeholder={isAiResponding ? "AI 助教正在回覆..." : "輸入你的問題..."}
                  className="flex-1 p-2 border rounded-lg resize-none disabled:bg-gray-200"
                  rows="2"
                  disabled={isAiResponding}
                />
                <button onClick={handleSendChat} disabled={!chatInput.trim() || isAiResponding} className="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700 disabled:bg-gray-400 flex items-center justify-center">
                  <Icon name="send" className="w-5 h-5"/>
                </button>
              </div>
            </div>
          </div>
        );
      };

      const renderContent = () => {
        switch (page) {
          case 'auth': return renderAuthContent();
          case 'intro': return <div className="flex items-center justify-center h-full">{renderIntroContent()}</div>;
          case 'learning': return renderLearningContent();
          default: return renderAuthContent();
        }
      };

      return (
        <div className="h-full flex flex-col">
            {page !== 'auth' && (
                <header className="h-14 bg-white shadow-md z-10 flex items-center justify-between px-6 flex-shrink-0">
                    <h1 className="text-3xl font-extrabold text-blue-600">CodeMate</h1>
                     {isLoggedIn && (
                        <button onClick={handleLogout} className="bg-red-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-red-600">
                            登出
                        </button>
                    )}
                </header>
            )}
            <main className="flex-1 overflow-hidden">
                {renderContent()}
            </main>
          
          {showMessage && (
            <div className="fixed top-5 right-5 bg-black text-white px-4 py-2 rounded-lg shadow-lg z-50 animate-pulse">
              {message}
            </div>
          )}
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
</script>

</body>
</html>
